<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quinayas AC | Atención a la mesa</title>
    <meta
      name="description"
      content="Solicitar atención desde la mesa."
    />
    <script>
      (function () {
        const assetBase =
          window.location.protocol === "file:" ? "./src/" : "/src/";
        const stylesheet = document.createElement("link");
        stylesheet.rel = "stylesheet";
        stylesheet.href = assetBase + "styles.css";
        document.head.appendChild(stylesheet);
      })();
    </script>
  </head>
  <body>
    <main class="app-shell">
      <section class="hero-card">
        <div class="brand-lockup" aria-label="Quinayas Aroma de Cacao">
          <img
            class="brand-logo"
            data-asset-path="assets/logo.png"
            src=""
            alt="Quinayas Aroma de Cacao"
          />
        </div>
        <div class="hero-header">
          <span id="tableBadge" class="table-badge">Mesa --</span>
        </div>

        <div id="modeBanner" class="mode-banner" hidden></div>

        <div class="status-panel" hidden>
          <p id="statusMessage" class="status-message">
            
          </p>
        </div>

        <div class="action-stack">
          <button
            id="waiterButton"
            class="primary-button"
            type="button"
            data-request-type="waiter"
          >
            Llamar al mesero
          </button>

          <button
            id="billButton"
            class="primary-button primary-button-secondary"
            type="button"
            data-request-type="bill"
          >
            Solicitar cuenta
          </button>
        </div>

        <p id="helperText" class="helper-text">
          La solicitud llegará al equipo con el número de tu mesa.
        </p>
        <div class="link-grid">
          <a
            href="https://menupp.co/quinayas?"
            class="info-link info-link-icon"
            aria-label="Ver menú"
          >
            <svg
              class="info-link-svg"
              viewBox="0 0 24 24"
              aria-hidden="true"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M6 5.5h12" />
              <path d="M6 10h12" />
              <path d="M6 14.5h8" />
              <path d="M6 19h8" />
              <path d="M17 14.5h2.5a1.5 1.5 0 0 1 0 3H17z" />
            </svg>
            <span class="sr-only">Menú</span>
          </a>
          <a
            href="https://www.instagram.com/quinayasac/"
            class="info-link info-link-icon"
            aria-label="Instagram"
          >
            <svg
              class="info-link-svg"
              viewBox="0 0 24 24"
              aria-hidden="true"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="4.5" y="4.5" width="15" height="15" rx="4.2" />
              <circle cx="12" cy="12" r="3.6" />
              <circle cx="17.2" cy="6.8" r="0.8" fill="currentColor" stroke="none" />
            </svg>
            <span class="sr-only">Instagram</span>
          </a>
        </div>
      </section>
    </main>

    <script type="module">
      const assetBase =
        window.location.protocol === "file:" ? "./src/" : "/src/";
      document
        .querySelectorAll("[data-asset-path]")
        .forEach((element) => {
          element.src = assetBase + element.dataset.assetPath;
        });
      import(assetBase + "main.js");
    </script>
  </body>
</html>
