<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quinayas AC | Atención a la mesa</title>
    <meta
      name="description"
      content="Solicitar atención desde la mesa."
    />
    <script>
      (function () {
        const assetBase =
          window.location.protocol === "file:" ? "./src/" : "/src/";
        const stylesheet = document.createElement("link");
        stylesheet.rel = "stylesheet";
        stylesheet.href = assetBase + "styles.css";
        document.head.appendChild(stylesheet);
      })();
    </script>
  </head>
  <body>
    <main class="app-shell">
      <section class="hero-card">
        <div class="brand-lockup" aria-label="Quinayas Aroma de Cacao">
          <img
            class="brand-logo"
            data-asset-path="assets/logo.png"
            src=""
            alt="Quinayas Aroma de Cacao"
          />
        </div>
        <div class="link-grid link-grid-header">
          <a
            href="https://quinayas.onrender.com/menu.html"
            class="info-link info-link-text"
            aria-label="Ver menú"
          >
            Menú
          </a>
          <a
            href="https://www.instagram.com/quinayasac/"
            class="info-link info-link-text"
            aria-label="Instagram"
          >
            Instagram
          </a>
        </div>
        <div class="hero-header">
          <span id="tableBadge" class="table-badge">Mesa --</span>
        </div>

        <div id="modeBanner" class="mode-banner" hidden></div>

        <div class="status-panel" hidden>
          <p id="statusMessage" class="status-message">
            
          </p>
        </div>

        <div class="action-stack">
          <button
            id="waiterButton"
            class="primary-button"
            type="button"
            data-request-type="waiter"
          >
            Llamar al mesero
          </button>

          <button
            id="billButton"
            class="primary-button primary-button-secondary"
            type="button"
            data-request-type="bill"
          >
            Solicitar cuenta
          </button>
        </div>

        <a
          href="https://menupp.co/coffeemaster/survey/Z5KK1guIGCJuBZkg1UAj"
          class="primary-button primary-button-tertiary action-link-button"
          aria-label="Votar en Coffee Tour Cali"
        >
          Vota en Coffee Tour Cali
        </a>

        <p id="helperText" class="helper-text">
          La solicitud llegará al equipo con el número de tu mesa.
        </p>
      </section>
    </main>

    <script type="module">
      const assetBase =
        window.location.protocol === "file:" ? "./src/" : "/src/";
      document
        .querySelectorAll("[data-asset-path]")
        .forEach((element) => {
          element.src = assetBase + element.dataset.assetPath;
        });
      import(assetBase + "main.js");
    </script>
  </body>
</html>
